global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend-api-gestor'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'backend'
          environment: 'local'

  - job_name: 'frontend-cliente-web'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'frontend'
          environment: 'local'

  - job_name: 'render-backend-cloud'
    scrape_interval: 15s
    scrape_timeout: 12s
    scheme: https
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ejercicio5myapigestor-k9qg.onrender.com']
        labels:
          service: 'backend'
          environment: 'render-cloud'

  - job_name: 'render-frontend-cloud'
    scrape_interval: 15s
    scrape_timeout: 12s
    scheme: https
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ejercicio5cliente-4o86.onrender.com']
        labels:
          service: 'frontend'
          environment: 'render-cloud'
